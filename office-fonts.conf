<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  Academic-Home 6.4: which font stands in for a font the server does not own.

  The server draws Word, PowerPoint and Excel files with LibreOffice (to make a PDF, and for every preview). It may
  only use fonts that are free to use. For the fonts most files are written in it has twins, equal in every letter's
  width, so lines and pages break where they break in Word:
      Calibri = Carlito, Cambria = Caladea, Arial = Liberation Sans, Times New Roman = Liberation Serif,
      Courier New = Liberation Mono, Arial Narrow = Liberation Sans Narrow, Helvetica = Nimbus Sans,
      Book Antiqua / Palatino = P052, Century Schoolbook = C059, Bookman Old Style = URW Bookman,
      Century Gothic = URW Gothic.
  For the others there is no twin. Until 6.4 every one of them (Aptos, the font of new Word files; Calibri Light, the
  font of Word's headings; Georgia, Verdana, Tahoma, Garamond and the rest) was drawn in DejaVu Sans, a much wider
  face, and a font with serifs came out without them: the PDF did not look like the file and had more pages. Here
  each is given the free font nearest to it in shape and width, and a font nobody has heard of is drawn in the
  Arial-like Liberation Sans, not in the wide DejaVu Sans.

  The Dockerfile installs this as /etc/fonts/conf.d/50-office-fonts.conf: after 49-sansserif.conf (which calls an
  unknown font "sans-serif") and before 57-dejavu-*.conf and 60-latin.conf (which would choose DejaVu or Noto for it).
  Symbol fonts (Symbol, Wingdings, Webdings) are not here: LibreOffice turns those into OpenSymbol itself.
-->
<fontconfig>
  <!-- the font of new Word files since 2024, and its kin: no free twin exists; Liberation Sans is nearest in shape and width -->
  <alias binding="same"><family>Aptos</family><accept><family>Liberation Sans</family></accept></alias>
  <alias binding="same"><family>Aptos Display</family><accept><family>Liberation Sans</family></accept></alias>
  <alias binding="same"><family>Aptos Light</family><accept><family>Liberation Sans</family></accept></alias>
  <alias binding="same"><family>Aptos SemiBold</family><accept><family>Liberation Sans</family></accept></alias>
  <alias binding="same"><family>Aptos Black</family><accept><family>Liberation Sans</family></accept></alias>
  <alias binding="same"><family>Aptos ExtraBold</family><accept><family>Liberation Sans</family></accept></alias>
  <alias binding="same"><family>Aptos Narrow</family><accept><family>Liberation Sans Narrow</family></accept></alias>
  <alias binding="same"><family>Aptos Mono</family><accept><family>Liberation Mono</family></accept></alias>
  <alias binding="same"><family>Aptos Serif</family><accept><family>Liberation Serif</family></accept></alias>
  <!-- Word's heading font from 2013 to 2023, and the Office fonts that share Calibri's and Cambria's proportions -->
  <alias binding="same"><family>Calibri Light</family><accept><family>Carlito</family></accept></alias>
  <alias binding="same"><family>Candara</family><accept><family>Carlito</family></accept></alias>
  <alias binding="same"><family>Corbel</family><accept><family>Carlito</family></accept></alias>
  <alias binding="same"><family>Gill Sans MT</family><accept><family>Carlito</family></accept></alias>
  <alias binding="same"><family>Gill Sans</family><accept><family>Carlito</family></accept></alias>
  <alias binding="same"><family>Lato</family><accept><family>Carlito</family></accept></alias>
  <alias binding="same"><family>Source Sans Pro</family><accept><family>Carlito</family></accept></alias>
  <alias binding="same"><family>Source Sans 3</family><accept><family>Carlito</family></accept></alias>
  <alias binding="same"><family>Cambria Math</family><accept><family>Caladea</family></accept></alias>
  <alias binding="same"><family>Constantia</family><accept><family>C059</family></accept></alias>
  <alias binding="same"><family>Sitka Text</family><accept><family>C059</family></accept></alias>
  <alias binding="same"><family>Rockwell</family><accept><family>C059</family></accept></alias>
  <alias binding="same"><family>Century</family><accept><family>C059</family></accept></alias>
  <alias binding="same"><family>Century Schoolbook</family><accept><family>C059</family></accept></alias>
  <!-- seriffed book faces -->
  <alias binding="same"><family>Georgia</family><accept><family>Gelasio</family><family>C059</family></accept></alias>
  <!-- Garamond: the free EB Garamond has no usable bold and writes its figures in the old style (1234 at different heights): the plain Liberation Serif instead -->
  <alias binding="same"><family>Garamond</family><accept><family>Liberation Serif</family></accept></alias>
  <alias binding="same"><family>Book Antiqua</family><accept><family>P052</family></accept></alias>
  <alias binding="same"><family>Palatino Linotype</family><accept><family>P052</family></accept></alias>
  <alias binding="same"><family>Palatino</family><accept><family>P052</family></accept></alias>
  <alias binding="same"><family>Bookman Old Style</family><accept><family>URW Bookman</family></accept></alias>
  <alias binding="same"><family>Baskerville Old Face</family><accept><family>Liberation Serif</family></accept></alias>
  <alias binding="same"><family>Baskerville</family><accept><family>Liberation Serif</family></accept></alias>
  <alias binding="same"><family>Bodoni MT</family><accept><family>Liberation Serif</family></accept></alias>
  <alias binding="same"><family>Perpetua</family><accept><family>Liberation Serif</family></accept></alias>
  <alias binding="same"><family>Monotype Corsiva</family><accept><family>Z003</family></accept></alias>
  <alias binding="same"><family>Lucida Calligraphy</family><accept><family>Z003</family></accept></alias>
  <!-- screen faces -->
  <alias binding="same"><family>Verdana</family><accept><family>DejaVu Sans</family></accept></alias>
  <alias binding="same"><family>Tahoma</family><accept><family>DejaVu Sans Condensed</family></accept></alias>
  <alias binding="same"><family>Segoe UI</family><accept><family>Open Sans</family></accept></alias>
  <alias binding="same"><family>Segoe UI Light</family><accept><family>Open Sans</family></accept></alias>
  <alias binding="same"><family>Segoe UI Semibold</family><accept><family>Open Sans</family></accept></alias>
  <alias binding="same"><family>Trebuchet MS</family><accept><family>Open Sans</family></accept></alias>
  <alias binding="same"><family>Lucida Sans</family><accept><family>Open Sans</family></accept></alias>
  <alias binding="same"><family>Lucida Sans Unicode</family><accept><family>Open Sans</family></accept></alias>
  <alias binding="same"><family>Inter</family><accept><family>Open Sans</family></accept></alias>
  <alias binding="same"><family>Franklin Gothic Book</family><accept><family>Liberation Sans</family></accept></alias>
  <alias binding="same"><family>Franklin Gothic Medium</family><accept><family>Liberation Sans</family></accept></alias>
  <alias binding="same"><family>Helvetica Neue</family><accept><family>Liberation Sans</family></accept></alias>
  <alias binding="same"><family>Microsoft Sans Serif</family><accept><family>Liberation Sans</family></accept></alias>
  <alias binding="same"><family>Arial Unicode MS</family><accept><family>Liberation Sans</family></accept></alias>
  <alias binding="same"><family>Arial Rounded MT Bold</family><accept><family>Liberation Sans</family></accept></alias>
  <alias binding="same"><family>Arial Black</family><accept><family>Liberation Sans</family></accept></alias>
  <alias binding="same"><family>Roboto</family><accept><family>Liberation Sans</family></accept></alias>
  <alias binding="same"><family>Ubuntu</family><accept><family>Liberation Sans</family></accept></alias>
  <alias binding="same"><family>SF Pro Text</family><accept><family>Liberation Sans</family></accept></alias>
  <alias binding="same"><family>Bahnschrift</family><accept><family>Liberation Sans Narrow</family></accept></alias>
  <alias binding="same"><family>Impact</family><accept><family>Liberation Sans Narrow</family></accept></alias>
  <alias binding="same"><family>Agency FB</family><accept><family>Liberation Sans Narrow</family></accept></alias>
  <!-- round, geometric faces -->
  <alias binding="same"><family>Century Gothic</family><accept><family>URW Gothic</family></accept></alias>
  <alias binding="same"><family>Avenir</family><accept><family>URW Gothic</family></accept></alias>
  <alias binding="same"><family>Avenir Next</family><accept><family>URW Gothic</family></accept></alias>
  <alias binding="same"><family>Futura</family><accept><family>URW Gothic</family></accept></alias>
  <alias binding="same"><family>Montserrat</family><accept><family>URW Gothic</family></accept></alias>
  <alias binding="same"><family>Poppins</family><accept><family>URW Gothic</family></accept></alias>
  <alias binding="same"><family>Nunito</family><accept><family>URW Gothic</family></accept></alias>
  <!-- hand and typewriter -->
  <alias binding="same"><family>Comic Sans MS</family><accept><family>Comic Neue</family></accept></alias>
  <alias binding="same"><family>Comic Sans</family><accept><family>Comic Neue</family></accept></alias>
  <alias binding="same"><family>Chalkboard</family><accept><family>Comic Neue</family></accept></alias>
  <alias binding="same"><family>Segoe Print</family><accept><family>Comic Neue</family></accept></alias>
  <alias binding="same"><family>Consolas</family><accept><family>Inconsolata</family><family>Liberation Mono</family></accept></alias>
  <alias binding="same"><family>Lucida Console</family><accept><family>DejaVu Sans Mono</family></accept></alias>
  <alias binding="same"><family>Menlo</family><accept><family>DejaVu Sans Mono</family></accept></alias>
  <alias binding="same"><family>Monaco</family><accept><family>DejaVu Sans Mono</family></accept></alias>
  <alias binding="same"><family>Cascadia Code</family><accept><family>DejaVu Sans Mono</family></accept></alias>
  <alias binding="same"><family>Cascadia Mono</family><accept><family>DejaVu Sans Mono</family></accept></alias>
  <!-- writing of East Asia -->
  <alias binding="same"><family>SimSun</family><accept><family>WenQuanYi Micro Hei</family></accept></alias>
  <alias binding="same"><family>NSimSun</family><accept><family>WenQuanYi Micro Hei</family></accept></alias>
  <alias binding="same"><family>SimHei</family><accept><family>WenQuanYi Micro Hei</family></accept></alias>
  <alias binding="same"><family>Microsoft YaHei</family><accept><family>WenQuanYi Micro Hei</family></accept></alias>
  <alias binding="same"><family>DengXian</family><accept><family>WenQuanYi Micro Hei</family></accept></alias>
  <alias binding="same"><family>MS Gothic</family><accept><family>WenQuanYi Micro Hei</family></accept></alias>
  <alias binding="same"><family>MS Mincho</family><accept><family>WenQuanYi Micro Hei</family></accept></alias>
  <alias binding="same"><family>Yu Gothic</family><accept><family>WenQuanYi Micro Hei</family></accept></alias>
  <alias binding="same"><family>Meiryo</family><accept><family>WenQuanYi Micro Hei</family></accept></alias>
  <alias binding="same"><family>Malgun Gothic</family><accept><family>WenQuanYi Micro Hei</family></accept></alias>

  <!-- a font nobody has a stand-in for: the plain Liberation faces, not the wide DejaVu ones -->
  <alias><family>sans-serif</family><prefer><family>Liberation Sans</family><family>Noto Sans</family><family>DejaVu Sans</family></prefer></alias>
  <alias><family>serif</family><prefer><family>Liberation Serif</family><family>Noto Serif</family><family>DejaVu Serif</family></prefer></alias>
  <alias><family>monospace</family><prefer><family>Liberation Mono</family><family>DejaVu Sans Mono</family></prefer></alias>
</fontconfig>
